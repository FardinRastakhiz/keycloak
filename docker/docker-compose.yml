name: keycloak

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.3}
        KC_FEATURES: ${KC_FEATURES:-scim-api}
    image: keycloak-custom:${KEYCLOAK_VERSION:-26.7.3}
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      # Database (runtime options; the driver was fixed to postgres at image build time)
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      # Initial admin user for the master realm (only used on first start)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Local-development networking: plain HTTP and accept any hostname
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
      # Theme caching off so edits under themes/ are picked up on reload
      KC_SPI_THEME_CACHE_THEMES: ${KC_SPI_THEME_CACHE_THEMES:-false}
      KC_SPI_THEME_CACHE_TEMPLATES: ${KC_SPI_THEME_CACHE_TEMPLATES:-false}
      KC_SPI_THEME_STATIC_MAX_AGE: ${KC_SPI_THEME_STATIC_MAX_AGE:--1}
      # Client secrets substituted into realm-export.json on import (required, see .env.example)
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?set KC_ADMIN_CLIENT_SECRET in docker/.env}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET:?set KC_CLIENT_SECRET in docker/.env}
    volumes:
      # Realms in this directory are imported on startup (existing realms are skipped)
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ../themes/shokoofa-theme:/opt/keycloak/themes/shokoofa-theme:ro
    ports:
      - "${KC_HTTP_PORT:-8080}:8080"
      - "${KC_MGMT_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # ubi-micro has no curl; use bash's /dev/tcp against the management port
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres_data:
